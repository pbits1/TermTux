  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"TermTux","url":"https://termtux.pages.dev/","description":"Searchable Linux commands reference with 1,050+ commands across 78 categories.","potentialAction":{"@type":"SearchAction","target":"https://termtux.pages.dev/category.html?cat={query}","query-input":"required name=query"}}

  <!-- Prevent FOUC on dark mode -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>

  <a href="#main" class="sr-only" style="position:absolute;top:-100px;left:0;z-index:9999;background:var(--yaru-orange);color:white;padding:8px 16px;font-size:14px;" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">Skip to main content</a>

          <div class="sidebar-title">TermTux</div>
          <div class="sidebar-subtitle">Linux Reference</div>

      </div>
      
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Categories">

      </nav>
      
      <div class="sidebar-footer">
        <a href="https://github.com/pbits1/TermTux" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="View source on GitHub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"></path></svg>
          GitHub Repo
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main">
      
      <!-- Top Bar -->
      <header class="top-bar" role="banner">
        <button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        
        <div class="search-container" role="search">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="search" class="search-input" id="searchInput" placeholder="Search commands, tools, fixes..." aria-label="Search commands" autocomplete="off">
          <kbd class="search-shortcut">Ctrl+K</kbd>
          <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
        </div>
        
        <div style="flex: 1"></div>
        
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </header>

      <!-- Hero -->
      <section class="page-hero fade-in-up" aria-labelledby="hero-title">
        <h1 id="hero-title">Linux Commands Directory</h1>
        <p>A comprehensive, searchable reference guide for Linux commands, tools, and fixes. <strong>1,050+ commands</strong> across <strong>78 categories</strong>.</p>
        
        <div class="stats-bar" style="justify-content: center; border: none; margin-top: var(--space-xl)">
          <div class="stat-item">
            <div class="stat-value">78</div>
            <div class="stat-label">Categories</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">1,050+</div>
            <div class="stat-label">Commands</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">6</div>
            <div class="stat-label">Sections</div>
          </div>
        </div>
      </section>

      <!-- Content Grid -->
      <div class="content-body">
        <div class="section-grid" id="homeSections">
          <!-- Rendered by script -->
        </div>
      </div>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">

      <span>Home</span>
    </a>
    <button class="bottom-nav-link" data-open-index aria-label="Open chapter index">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      <span>Index</span>
    </button>
    <a href="tools.html" class="bottom-nav-link" aria-label="Interactive tools">

    <button class="bottom-nav-link" data-focus-search aria-label="Search commands">

      <span>Search</span>
    </button>
  </nav>

  <script type="module">
    import { sections } from './js/categories.js';

    // Render home sections with visible topic links (no more first-topic-only cards)
    const homeSections = document.getElementById('homeSections');
    let html = '';

    const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    sections.forEach((section, idx) => {
      const visible = section.categories.slice(0, 5);
      const remaining = section.categories.length - visible.length;
      const topics = visible.map(c => `<li><a class="section-topic-link" href="category.html#${c.id}"><span aria-hidden="true">›</span> ${esc(c.title)}</a></li>`).join('');
      html += `
        <div class="section-card fade-in-up stagger-${idx+1}">
          <div class="section-card-icon" aria-hidden="true">${section.icon}</div>
          <h2><a class="section-title-link" href="category.html?section=${section.id}">${esc(section.title)}</a></h2>
          <p>${esc(section.description)}</p>
          <div class="card-count">${section.categories.length} Topics</div>
          <ul class="section-topics" aria-label="${esc(section.title)} topics">
            ${topics}
            ${remaining > 0 ? `<li><a class="section-topics-more" href="category.html?section=${section.id}">+ ${remaining} more — open chapter index →</a></li>` : ''}
          </ul>
        </div>
      `;
    });

    homeSections.innerHTML = html;
  </script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered.'))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
